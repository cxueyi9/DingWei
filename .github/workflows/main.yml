name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos
        run: |
          # 使用官方一键安装脚本（自动安装 Theos、工具链和 SDK）
          curl -sSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash -s -- --prefix $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 检查 SDK 是否存在，若不存在则从 sdks 仓库稀疏检出
          if [ ! -d "$HOME/theos/sdks/iPhoneOS.sdk" ]; then
            echo "iPhoneOS.sdk not found, cloning from sdks repo..."
            rm -rf $HOME/theos/sdks   # 移除可能存在的空目录
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks
            cd $HOME/theos/sdks
            git sparse-checkout set iPhoneOS.sdk
          fi
          echo "THEOS_SDK_PATH=$HOME/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
