name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos
        run: |
          # 使用官方 install-theos 脚本，自动安装 Theos、工具链和 SDK
          curl -sSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash -s -- --prefix $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
