name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos and SDK
        run: |
          # 克隆 Theos 主仓库
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 从 sdks 仓库稀疏检出 iPhoneOS.sdk 到独立目录（避免与 theos 冲突）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/sdks
          cd $HOME/sdks
          git sparse-checkout set iPhoneOS.sdk
          # 设置 SDK 路径，让 Theos 使用
          echo "THEOS_SDK_PATH=$HOME/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
