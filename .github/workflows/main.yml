name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos, toolchain and SDK
        run: |
          # 克隆 Theos
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 下载预编译工具链（仅 arm64 可用）
          curl -L https://github.com/theos/toolchain/releases/download/20240419/toolchain-linux-x86_64.tar.xz -o toolchain.tar.xz
          tar -xf toolchain.tar.xz -C $HOME/theos
          echo "THEOS_TOOLCHAIN_DIR=$HOME/theos/toolchain" >> $GITHUB_ENV

          # 克隆 SDK（只取 iPhoneOS.sdk）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks
          cd $HOME/theos/sdks
          git sparse-checkout set iPhoneOS.sdk
          echo "THEOS_SDK_PATH=$HOME/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make -j 4
          # 查找生成的 dylib
          DYLIB=$(find .theos/obj -name "*.dylib" | head -n 1)
          echo "Found dylib: $DYLIB"
          file $DYLIB
          # 检查架构
          lipo -info $DYLIB || true
          # 如果包含多个架构，提取 arm64（确保只有 arm64）
          # 这里我们可以直接用 lipo 提取 arm64 并替换原文件
          if lipo -info $DYLIB | grep -q "arm64"; then
            lipo $DYLIB -thin arm64 -output locationfaker_arm64.dylib
            mv locationfaker_arm64.dylib locationfaker.dylib
          else
            cp $DYLIB locationfaker.dylib
          fi
          # 再次检查最终文件
          file locationfaker.dylib
          # 尝试用 ldid 签名（确保可以被识别）
          # 安装 ldid
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid
          chmod +x ldid
          ./ldid -S locationfaker.dylib || echo "ldid signing failed, but continuing"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
