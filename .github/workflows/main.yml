name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos via install-theos
        run: |
          # 使用官方 install-theos 脚本（自动处理工具链和 SDK）
          curl -sSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash -s -- --prefix $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 动态查找并设置 SDK 路径
          SDK_DIR=$(find $HOME/theos/sdks -maxdepth 1 -type d -name "*.sdk" | head -n 1)
          if [ -n "$SDK_DIR" ]; then
            echo "THEOS_SDK_PATH=$SDK_DIR" >> $GITHUB_ENV
            echo "Using SDK: $SDK_DIR"
          else
            # 若未找到，从 sdks 仓库稀疏检出
            echo "No SDK found, cloning from sdks repo..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks
            cd $HOME/theos/sdks
            git sparse-checkout set iPhoneOS.sdk
            echo "THEOS_SDK_PATH=$HOME/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV
          fi

      - name: Build dylib
        run: |
          make -j 4
          DYLIB=$(find .theos/obj -name "*.dylib" | head -n 1)
          echo "Found dylib: $DYLIB"
          file $DYLIB
          lipo -info $DYLIB || true
          # 如果包含 arm64，则提取单架构（确保 ldid 兼容）
          if lipo -info $DYLIB | grep -q "arm64"; then
            lipo $DYLIB -thin arm64 -output locationfaker.dylib
          else
            cp $DYLIB locationfaker.dylib
          fi
          file locationfaker.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
