name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos, toolchain and SDK
        run: |
          # 1. 克隆 Theos 主仓库
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 2. 下载已知可用的工具链（版本 20240419）
          curl -L -o toolchain.tar.xz https://github.com/theos/toolchain/releases/download/20240419/toolchain-linux-x86_64.tar.xz
          tar -xf toolchain.tar.xz -C $HOME/theos
          echo "THEOS_TOOLCHAIN_DIR=$HOME/theos/toolchain" >> $GITHUB_ENV

          # 3. 克隆 SDK 并稀疏检出 iPhoneOS.sdk
          rm -rf $HOME/theos/sdks  # 确保目录不存在
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks
          cd $HOME/theos/sdks
          git sparse-checkout set iPhoneOS.sdk
          echo "THEOS_SDK_PATH=$HOME/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

          # 检查 SDK 是否存在
          if [ ! -d "$HOME/theos/sdks/iPhoneOS.sdk" ]; then
            echo "ERROR: iPhoneOS.sdk not found after sparse checkout"
            exit 1
          fi
          ls -la $HOME/theos/sdks

      - name: Build dylib
        run: |
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
