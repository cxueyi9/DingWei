name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos, toolchain and SDK
        run: |
          # 1. 使用官方脚本安装 Theos 和工具链
          curl -sSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash -s -- --prefix $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 2. 完整克隆 SDK 仓库（深度1，包含所有 SDK）
          rm -rf $HOME/theos/sdks   # 删除可能存在的空目录
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks

          # 3. 设置 SDK 路径
          echo "THEOS_SDK_PATH=$HOME/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

          # 4. 验证 SDK 是否存在
          ls -la $HOME/theos/sdks
          if [ ! -d "$HOME/theos/sdks/iPhoneOS.sdk" ]; then
            echo "ERROR: iPhoneOS.sdk not found!"
            exit 1
          fi

      - name: Build dylib
        run: |
          # 打印环境变量以确认
          echo "THEOS_SDK_PATH=$THEOS_SDK_PATH"
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
