name: Build LocationFaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl unzip

      - name: Setup Theos, toolchain and SDK
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          # 设置 git 基础信息
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 生成认证 Header（使用 GITHUB_TOKEN）
          AUTH_HEADER="Authorization: basic $(echo -n x-access-token:${{ secrets.GITHUB_TOKEN }} | base64)"
          git config --global http.extraheader "$AUTH_HEADER"

          # 克隆 Theos
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 克隆 toolchain
          git clone --depth 1 https://github.com/theos/toolchain.git $HOME/toolchain
          echo "THEOS_TOOLCHAIN_DIR=$HOME/toolchain" >> $GITHUB_ENV

          # 克隆 sdks 并稀疏检出 iPhoneOS.sdk
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/sdks
          cd $HOME/sdks
          git sparse-checkout set iPhoneOS.sdk
          echo "THEOS_SDK_PATH=$HOME/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make -j 4
          find .theos/obj -name "*.dylib" -exec cp {} locationfaker.dylib \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationfaker
          path: locationfaker.dylib
